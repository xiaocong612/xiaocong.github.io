subtitle: 技术、学习与生活的长期记录
phrases:
  - text: 欢迎来到我的小窝
  - text: 记录技术，分享生活
  - text: 保持好奇，慢慢生长
  - text: 无限进步
quotes:
  - text: 不积跬步，无以至千里；不积小流，无以成江海。
    author: 荀子《劝学》
  - text: 山重水复疑无路，柳暗花明又一村。
    author: 陆游《游山西村》
  - text: 纸上得来终觉浅，绝知此事要躬行。
    author: 陆游《冬夜读书示子聿》
  - text: 行到水穷处，坐看云起时。
    author: 王维《终南别业》
